name: Build myOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang lld xorriso qemu-system-x86 git
      - name: Build
        run: make
      - name: Smoke test boot
        run: timeout 8s qemu-system-x86_64 -cdrom build/myos.iso -m 256M -display none -serial stdio || test $? -eq 124
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: myos-iso
          path: build/myos.iso
