name: Validate myStore submissions

on:
  pull_request:
    paths:
      - "store/submissions/**"
      - "store/community.schema.json"
      - "tools/validate_store_submission.py"
  push:
    paths:
      - "store/submissions/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate community metadata
        run: python3 tools/validate_store_submission.py
